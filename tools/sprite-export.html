<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite export</title>
<style>
  body { margin: 0; padding: 16px; background: #2b2a28; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  #pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  figure { margin: 0; padding: 8px; background: #3a3936; }
  img { image-rendering: pixelated; display: block; margin: 0 auto 6px; }
  figcaption { word-break: break-all; }
</style>
</head>
<body>
<h1>Sprite export</h1>
<p>Every piece of art an artist can redraw, one pixel an art pixel, with no outline (shown here 4×). <code>npm run export-sprites</code> saves them to <code>art/export/</code>.</p>
<div id="pieces"></div>
<script type="module" src="./sprite-export.ts"></script>
</body>
</html>
