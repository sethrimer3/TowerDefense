<!doctype html>
<html lang="en" class="game-loading pixel-font">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b09" />
    <meta
      name="description"
      content="Lay out a walled city and hold it against endless waves. A mobile city-defense game."
    />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./GameIcon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Tower Defense</title>
  </head>
  <body>
    <div id="loading-screen" role="status" aria-label="Loading game">
      <canvas class="loading-stones" aria-hidden="true"></canvas>
      <canvas class="loading-torch" aria-hidden="true"></canvas>
      <div class="loading-corner" aria-hidden="true">
        <span class="loading-label">loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></span>
        <canvas class="loading-bricks"></canvas>
      </div>
      <button class="loading-retry" type="button" hidden>Try again</button>
    </div>
    <div id="app" inert aria-busy="true"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
