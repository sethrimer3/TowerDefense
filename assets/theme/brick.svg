<svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" viewBox="0 0 16 8" shape-rendering="crispEdges">
  <!-- Dark brickwork, two courses, the mortar black; tiles seamlessly. -->
  <rect width="16" height="8" fill="#0d0a0a"/>
  <rect x="0" y="0" width="7" height="3" fill="#3a2522"/>
  <rect x="8" y="0" width="7" height="3" fill="#2f201e"/>
  <rect x="0" y="4" width="3" height="3" fill="#2b1d1b"/>
  <rect x="4" y="4" width="7" height="3" fill="#36231f"/>
  <rect x="12" y="4" width="4" height="3" fill="#2b1d1b"/>
  <!-- Lit top edges, shaded lower edges. -->
  <rect x="0" y="0" width="7" height="1" fill="#4a302b"/>
  <rect x="8" y="0" width="7" height="1" fill="#3e2a26"/>
  <rect x="0" y="4" width="3" height="1" fill="#392623"/>
  <rect x="4" y="4" width="7" height="1" fill="#462d28"/>
  <rect x="12" y="4" width="4" height="1" fill="#392623"/>
  <rect x="0" y="2" width="7" height="1" fill="#2a1a18"/>
  <rect x="8" y="2" width="7" height="1" fill="#221715"/>
  <rect x="4" y="6" width="7" height="1" fill="#271916"/>
  <!-- A few chips. -->
  <rect x="2" y="1" width="1" height="1" fill="#24171a"/>
  <rect x="11" y="1" width="1" height="1" fill="#46302a"/>
  <rect x="7" y="5" width="1" height="1" fill="#241816"/>
</svg>
