<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defend areas</title>
<style>body{margin:16px;background:#17181b;color:#ddd;font:14px sans-serif}.areas{display:grid;grid-template-columns:repeat(3,320px);gap:16px}canvas{width:320px;height:440px}h2{font-size:14px}button{font:inherit}@media(max-width:600px){.areas{grid-template-columns:320px}}</style></head>
<body><p>Area art verification · player saves are untouched</p><div class="areas"></div>
<script type="module">
import { AREAS } from '../src/defend/areas.ts';
import { defaultLayout, fitLayout } from '../src/defend/layout.ts';
import { generateCity } from '../src/defend/citygen.ts';
import { DefendRenderer } from '../src/defend/render.ts';
import { DefendSim } from '../src/defend/sim.ts';
import { defaultDefendSave } from '../src/defend/progress.ts';
import { floorArtLoaded } from '../src/defend/city-layer.ts';
const map=generateCity(fitLayout(defaultLayout()),5);
const opts={grid:0,weather:null,night:0,now:1000,reduceMotion:true,effects:false};
const renderers=AREAS.map(area=>{
  const section=document.createElement('section');section.innerHTML=`<h2 style="color:${area.color}">${area.name}</h2><canvas></canvas>`;document.querySelector('.areas').append(section);
  const r=new DefendRenderer(section.querySelector('canvas'));r.resize(320,440);return r;
});
const timeout=performance.now()+10000;
while(!AREAS.every(a=>floorArtLoaded(a.id)===4)) {if(performance.now()>timeout)throw Error('Area floors failed to load');await new Promise(r=>setTimeout(r,50));}
await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
// Give wall onload callbacks their own task before painting.
await new Promise(r=>setTimeout(r,100));
renderers.forEach((r,i)=>r.draw(map,null,null,{...opts,area:AREAS[i].id}));
window.areaFixture={map,opts,renderers,sim:new DefendSim(map,defaultDefendSave().levels,42)};
</script></body></html>
