<!doctype html>
<html lang="en" class="pixel-font">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Building menu</title>
    <style>
      body { margin: 0; }
      main { max-width: 1100px; margin: auto; padding: 16px; font-family: var(--font); }
      h1 { margin: 0 0 8px; font-size: 26px; }
      h2 { margin: 22px 0 8px; font-size: 20px; }
      p { max-width: 720px; line-height: 1.45; margin: 0 0 10px; }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      .controls button { padding: 6px 10px; }
      #live { height: 620px; }
      #live { display: flex; flex-direction: column; }
      #live .defend-city { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #live .defend-stage { flex: 1; min-height: 0; }
      .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
      .icons figure { margin: 0; display: grid; justify-items: center; gap: 6px; padding: 8px 4px; border: 2px solid var(--brass); background: var(--brass-nails), linear-gradient(#0006, #0006), var(--wood); }
      .icons img { width: 48px; height: 48px; image-rendering: pixelated; }
      .icons figcaption { font-size: 12px; text-align: center; }
      .menus { display: flex; flex-wrap: wrap; gap: 16px; }
      .menu-demo { position: relative; flex: none; overflow: hidden; background: #2f4a24; border: 2px solid #000; }
      .menu-demo canvas.building { position: absolute; image-rendering: pixelated; }
      .menu-demo .building-menu { animation: none; }
      #squares { width: 100%; max-width: 720px; aspect-ratio: 3 / 2; display: block; image-rendering: pixelated; border: 2px solid #000; }
      @media (max-width: 480px) { main { padding: 12px 8px; } #live { height: 560px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Building menu</h1>
      <p>The square building menu, its icons, square ranges, crosshairs with their nearby square, and the build palette's opening flash. Nothing here is wired into the game yet. This page reads no player saves.</p>
      <h2>On the board</h2>
      <div class="controls" id="live-controls">
        <button data-show="shooter">Archer tower</button>
        <button data-show="troops">Melee Guild</button>
        <button data-show="plain">Keep</button>
        <button data-show="none">Close menu</button>
        <button data-flash>Open the palette (flash)</button>
      </div>
      <div id="live"></div>
      <h2>Menus</h2>
      <div class="menus" id="menus"></div>
      <h2>Icons</h2>
      <div class="icons" id="icons"></div>
      <h2>Square ranges</h2>
      <canvas id="squares"></canvas>
    </main>
    <script type="module" src="./building-menu-view.ts"></script>
  </body>
</html>
