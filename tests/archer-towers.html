<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archer Tower attunements</title>
<style>body{margin:0;background:#1c292b;color:#d7e9e9;font:14px monospace}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
import {defaults} from '../src/save.ts';
import {DefendSim} from '../src/defend/sim.ts';
import {CellType,generateCity} from '../src/defend/citygen.ts';
import {defaultLayout,fitLayout} from '../src/defend/layout.ts';
import {Towers} from '../src/defend/towers.ts';
import {drawUnits} from '../src/defend/battle-art.ts';
import {paintStructureArt} from '../src/defend/structure-art.ts';
import {setPixelArt} from '../src/defend/pixel-sprites.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),small=innerWidth<700;
canvas.width=small?390:1170;canvas.height=small?1770:590;
function make(kind,rank=0){
 const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),4),defaults().defend.levels,1);
 sim.enemies=[];sim.soldiers=[];sim.civilians=[];sim.solid.fill(0);sim.ownSolid.fill(0);sim.foeSolid.fill(0);sim.map.type.fill(CellType.STREET);
 const b={...sim.keep,kind,rect:{x:3,y:4,w:2,h:2},structureUid:42};sim.map.buildings[b.id]=b;
 const path=kind==='wispTower'?'wispArrow':kind==='hawkTower'?'sharpshooters':'fireArrows';sim.bonuses={...sim.bonuses,structurePaths:rank?{42:{[kind]:{path,rank}}}:{}};
 return{sim,b,t:new Towers()};
}
function add(s){for(let i=0;i<7;i++)s.sim.enemies.push({id:s.sim.newId(),kind:i===6?'ogre':'orc',x:6.5+i*.35,y:4.6+Math.sin(i)*1.2,hp:100000+i*100,maxHp:100000+i*100,cd:0,flash:0,jx:0,jy:0,distract:-1,distractT:0,rollT:0,marked:false});s.sim.reindexAfterDisplacement();}
const kinds=['brazierTower','hawkTower','wispTower'],scenes=kinds.map(k=>make(k,k==='wispTower'?2:3));
function combat(s,reduced=false){drawUnits({c,px:32},s.sim,null,false,undefined,{reduceMotion:reduced});}
// Let the arrow wander, then build a slice with actual flight history.
for(let i=0;i<90;i++){for(const s of scenes){s.t.step(s.sim,1/30);s.sim.time+=1/30;}combat(scenes[2]);}
scenes.forEach(add);
for(let i=0;i<6;i++){for(const s of scenes){s.t.step(s.sim,1/30);s.sim.time+=1/30;}combat(scenes[2]);}
function draw({pixel=true,reduced=false}={}){
 setPixelArt(pixel);c.fillStyle='#1c292b';c.fillRect(0,0,canvas.width,canvas.height);c.imageSmoothingEnabled=false;
 scenes.forEach((s,i)=>{
  c.save();c.translate(small?0:i*390,small?i*590:0);c.fillStyle='#def0ef';c.font='16px monospace';c.fillText(['Fire arrows — unchanged','Hawk — sustained focus','Wisp — Fire arrows'][i],14,27);
  const count=i===2?3:4;
  for(let rank=0;rank<count;rank++){paintStructureArt(c,kinds[i],{x:14+rank*91,y:48,w:68,h:68,px:34},0,0,rank?(i===2?'wispArrow':i?'sharpshooters':'fireArrows'):'');c.fillStyle='#d7e9e9';c.font='12px monospace';c.fillText(['Attune','I','II','III'][rank],17+rank*91,136);}
  c.fillStyle='#243c38';c.fillRect(10,162,370,370);c.strokeStyle='#38514a';c.lineWidth=1;
  for(let x=10;x<380;x+=32){c.beginPath();c.moveTo(x,162);c.lineTo(x,532);c.stroke();}
  for(let y=162;y<532;y+=32){c.beginPath();c.moveTo(10,y);c.lineTo(380,y);c.stroke();}
  c.save();c.beginPath();c.rect(10,162,370,370);c.clip();c.translate(0,162);
  paintStructureArt(c,kinds[i],{x:3*32,y:4*32,w:64,h:64,px:32},0,0,i===2?'wispArrow':i?'sharpshooters':'fireArrows');combat(s,reduced);c.restore();
  c.fillStyle='#d7e9e9';c.font='12px monospace';c.fillText(['Burning arrows, final three-arrow volley','Current HP lock; damage and cadence ramp','3 blue + 2 fire; flaming trails and blasts'][i],13,557);c.restore();
 });
}
window.archerGallery={draw,scenes,canvas,c,advance(n=1){for(let i=0;i<n;i++){for(const s of scenes){s.t.step(s.sim,1/30);s.sim.time+=1/30;}draw();}}};draw();
</script></html>
