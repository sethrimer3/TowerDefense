<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisp lightning preview</title>
<style>body{margin:0;background:#142024;color:#ede2ff;font:14px monospace}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
import {defaults} from '../src/save.ts';
import {DefendSim} from '../src/defend/sim.ts';
import {CellType,generateCity} from '../src/defend/citygen.ts';
import {defaultLayout,fitLayout} from '../src/defend/layout.ts';
import {CELLS_W,CELLS_H} from '../src/defend/grid.ts';
import {Towers} from '../src/defend/towers.ts';
import {drawWisps} from '../src/defend/wisp-art.ts';
import {drawWispCore} from '../src/defend/wisp-core-art.ts';
import {paintStructureArt} from '../src/defend/structure-art.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),small=innerWidth<700;
canvas.width=small?390:960;canvas.height=small?950:850;
const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),4),defaults().defend.levels,1);
sim.enemies=[];sim.soldiers=[];sim.civilians=[];sim.solid.fill(0);sim.ownSolid.fill(0);sim.foeSolid.fill(0);sim.map.type.fill(CellType.ROAD);
const b={...sim.keep,kind:'wispTower',rect:{x:35,y:81,w:2,h:2},structureUid:42};sim.map.buildings[b.id]=b;
sim.bonuses={...sim.bonuses,structurePaths:{42:{wispTower:{path:'wispArrow',rank:3}}}};
const t=new Towers();t.step(sim,0);const owner=sim.wispOwners.get(b.id),w=owner.lightning.arrows[0],originals=[...sim.wisps];
// Isolate one final-tier strike; the native gallery tests all six arrows together.
owner.arrows=[];owner.capacity=0;delete owner.fire;sim.wisps=[w];
w.x=36;w.y=82;w.angle=-Math.PI/2;
for(const y of[76,65,50,35,20,5])for(const x of[36,41])sim.enemies.push({id:sim.newId(),kind:y%2?'bat':'orc',x,y,hp:1e6,maxHp:1e6,cd:0,flash:0,jx:0,jy:0,distract:-1,distractT:0,rollT:0,marked:false});
sim.reindexAfterDisplacement();
const px=small?4.75:6,ox=small?24:80,oy=small?380:120;
function draw(reduced=false){
 c.globalAlpha=1;c.fillStyle='#142024';c.fillRect(0,0,canvas.width,canvas.height);c.font='18px monospace';c.fillStyle='#f2e5ff';c.fillText('Wisp Tower — final tier',20,30);
 const colors=[['#123954','#65c4ef','#efffff'],['#732c1c','#f99b36','#fff0b1'],['#36115e','#a24aff','#f8d9ff']];
 const xs=small?[65,190,315]:[640,760,880];
 originals.filter(a=>(!a.fire&&!a.lightning&&a.slot===0)||(a.fire&&a.slot===0)||a.lightning).forEach((a,i)=>{
  c.save();c.translate(xs[i],small?110:220);drawWispCore(c,64,{...a,x:0,y:0,angle:-Math.PI/2},colors[i]);c.restore();
  c.fillStyle=colors[i][1];c.font='12px monospace';c.fillText(['Blue 100%','Fire 125%','Purple 175%'][i],xs[i]-40,small?225:325);
 });
 c.font='12px monospace';c.fillStyle='#d5c5e5';
 const lines=['Straight strike to the map edge','5-second purple lightning','300% attack damage per second','One arrow / 9-second refill'];
 lines.forEach((line,i)=>c.fillText(line,small?20:595,(small?270:390)+i*18));
 c.save();c.translate(ox,oy);c.fillStyle='#233531';c.fillRect(0,0,CELLS_W*px,CELLS_H*px);
 c.strokeStyle='#345046';c.lineWidth=1;
 for(let x=0;x<=CELLS_W;x+=8){c.beginPath();c.moveTo(x*px,0);c.lineTo(x*px,CELLS_H*px);c.stroke();}
 for(let y=0;y<=CELLS_H;y+=8){c.beginPath();c.moveTo(0,y*px);c.lineTo(CELLS_W*px,y*px);c.stroke();}
 c.strokeStyle='#9f7cc8';c.strokeRect(0,0,CELLS_W*px,CELLS_H*px);
 paintStructureArt(c,'wispTower',{x:b.rect.x*px,y:b.rect.y*px,w:2*px,h:2*px,px},0,0,'wispArrow');
 drawWisps(c,px,sim,reduced);
 for(const e of sim.enemies){c.fillStyle=e.hp<e.maxHp?'#ff9eec':'#9bba85';c.fillRect(e.x*px-2,e.y*px-2,4,4);}
 c.restore();
}
function advance(dt){t.step(sim,dt);sim.time+=dt;draw();}
window.wispLightning={canvas,c,sim,b,t,owner,w,draw,advance};advance(.8);
</script></html>
