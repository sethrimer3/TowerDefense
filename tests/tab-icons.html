<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Legacy tab icons</title>
    <style>
      body { margin: 0; }
      main { max-width: 960px; margin: auto; padding: 24px; font-family: var(--font); }
      h1 { margin: 0 0 12px; font-size: 28px; }
      .intro { max-width: 640px; line-height: 1.5; }
      h2 { margin: 24px 0 8px; font-size: 22px; }
      .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      #selected { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
      article { display: grid; justify-items: center; gap: 12px; padding: 14px 6px; border: 2px solid var(--brass); background: var(--brass-nails), linear-gradient(#0005, #0005), var(--wood); border-radius: 4px; }
      h3 { margin: 0; font-size: 18px; }
      .study { width: 96px; height: 96px; image-rendering: pixelated; }
      .sample-tab { display: grid; justify-items: center; gap: 4px; padding: 8px; min-width: 72px; border: 1px solid var(--brass); background: var(--stone); border-radius: 4px; }
      .sample-tab canvas { width: 42px; height: 42px; image-rendering: pixelated; }
      .sample-tab span { font-size: 12px; }
      .caption { font-size: 13px; line-height: 1.3; margin: 0; text-align: center; }
      @media (max-width: 480px) {
        main { padding: 16px 12px; }
        h1 { font-size: 24px; }
        .options { gap: 6px; }
        #selected { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
        .study { width: 48px; height: 48px; }
        .sample-tab { min-width: 0; padding: 6px; }
        .sample-tab canvas { width: 32px; height: 32px; }
        .caption { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Legacy tab icons</h1>
      <p class="intro">Enable Show legacy graphics in Settings for these designs: Defend A, the Defend C castle gate for Ambush, a new sword for Siege, and Settings B.</p>
      <div id="selected"></div>
      <h2>Original studies</h2>
      <div id="gallery"></div>
    </main>
    <script type="module" src="./tab-icons-view.ts"></script>
  </body>
</html>
