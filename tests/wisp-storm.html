<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisp arrow storm</title>
<style>body{margin:0;background:#1c292b}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
// Three frames of a Wisp tower: a full quiver circling, the moment it looses
// its 30-degree spray, and the spray in flight. No player saves.
import {defaults} from '../src/save.ts';
import {DefendSim} from '../src/defend/sim.ts';
import {CellType,generateCity} from '../src/defend/citygen.ts';
import {defaultLayout,fitLayout} from '../src/defend/layout.ts';
import {Towers,stepArrows} from '../src/defend/towers.ts';
import {drawUnits} from '../src/defend/battle-art.ts';
import {paintStructureArt} from '../src/defend/structure-art.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),small=innerWidth<700,px=small?24:32,side=small?390:400;
canvas.width=small?390:1200;canvas.height=small?1170:400;
function make(){
 const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),4),defaults().defend.levels,1);
 sim.enemies=[];sim.soldiers=[];sim.civilians=[];sim.solid.fill(0);sim.ownSolid.fill(0);sim.foeSolid.fill(0);sim.map.type.fill(CellType.STREET);
 const b={...sim.keep,kind:'wispTower',rect:{x:5,y:5,w:2,h:2},structureUid:42};sim.map.buildings[b.id]=b;sim.bonuses={...sim.bonuses,structurePaths:{}};
 return{sim,b,t:new Towers()};
}
const step=(s,n)=>{for(let i=0;i<n;i++){s.t.step(s.sim,1/30);stepArrows(s.sim,1/30);s.sim.arrows=s.sim.arrows.filter(a=>a.life>0);s.sim.time+=1/30;}};
const scenes=[make(),make(),make()];
for(const s of scenes)step(s,31*30);
const foe=s=>{s.sim.enemies.push({id:s.sim.newId(),kind:'orc',x:11.5,y:6,hp:1e6,maxHp:1e6,cd:0,flash:0,jx:0,jy:0,distract:-1,distractT:0,rollT:0,marked:false});s.sim.reindexAfterDisplacement();};
foe(scenes[1]);step(scenes[1],1);foe(scenes[2]);step(scenes[2],7);
function draw(reduced=false){
 c.fillStyle='#1c292b';c.fillRect(0,0,canvas.width,canvas.height);c.imageSmoothingEnabled=false;
 scenes.forEach((s,i)=>{
  c.save();c.translate(small?0:i*side,small?i*side:0);c.beginPath();c.rect(0,0,side-8,side-8);c.clip();
  c.fillStyle='#2e4a3a';c.fillRect(0,0,side,side);c.translate(-px*1.6,-px*1.4);
  paintStructureArt(c,'wispTower',{x:5*px,y:5*px,w:2*px,h:2*px,px},0,0,'');
  drawUnits({c,px},s.sim,null,false,undefined,{reduceMotion:reduced});c.restore();
 });
}
window.stormGallery={draw,scenes,step(n){for(const s of scenes)step(s,n);draw();}};draw();
</script></html>
