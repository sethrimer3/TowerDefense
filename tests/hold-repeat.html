<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated hold repeat fixture</title></head>
<body><div id="purchases"></div><button id="other">Another action</button>
<script type="module">
import { holdToRepeat } from '../src/ui/hold-repeat.ts';
const root = document.querySelector('#purchases');
const state = { times: [], limit: Infinity, other: 0 };
function draw() {
  root.innerHTML = `<button data-buy="one" style="width:180px;height:60px" ${state.times.length >= state.limit ? 'disabled' : ''}><span>Purchase one</span></button>`;
  root.querySelector('button').onclick = () => { state.times.push(performance.now()); draw(); };
}
draw();
document.querySelector('#other').onclick = () => state.other++;
window.holdFixture = { state, stop: holdToRepeat(root, ['data-buy']) };
</script></body></html>
