<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library idle simulation fixture</title></head>
<body><div id="app"></div><script type="module">
import '../src/style.css';
import '../src/theme.css';
import { buildShell } from '../src/ui/shell.ts';
import { LibrarySim } from '../src/library/sim.ts';
import { MineSim } from '../src/mine/sim.ts';
import { LibraryPage } from '../src/library/ui.ts';
import { MinePage } from '../src/mine/ui.ts';
buildShell(document.querySelector('#app'));
let clock = 960000, knowledge = 0, points = 0, showing = 'library';
const library = new LibraryPage(document.querySelector('#library'), {
  gold: () => 0, free: () => true, spendGold() {}, effects: () => true, newSeed: () => 5,
  clock: () => clock, earnKnowledge: n => knowledge += n,
  upgrades: () => ({ fireproof: 1000, fireTraining: 0, nightWatch: 0 }), showing: () => showing === 'library',
});
const mine = new MinePage(document.querySelector('#mine'), {
  gold: () => 0, free: () => true, spendGold() {}, effects: () => true, newSeed: () => 9,
  earn: p => points += p.copper + p.silver + p.gold, upgrades: () => ({ coffee: 0, waterproof: 0, smiths: 0 }),
  busySmiths: () => new Set(), modal: document.querySelector('#modal'), store() {},
});
const l = new LibrarySim(5); l.furnish(40); for (let n = 0; n < 8; n++) l.hire();
library.load(l.save(clock - 3600000), clock);
mine.load(new MineSim(9).save(clock - 3600000), clock);
function show(tab) {
  showing = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === tab));
  if (tab === 'library') { library.show(); library.frame(clock); }
  if (tab === 'mine') { mine.show(); mine.frame(clock); }
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => show(b.dataset.tab));
show('library');
window.idleFixture = {
  library, mine, show,
  read: () => ({ knowledge, points, libraryOwed: library.owedMs, mineOwed: mine.owedMs, time: library.sim.time }),
  step: (ms = 16) => { clock += ms; library.advance(clock); mine.advance(clock); if (showing === 'library') library.frame(clock); else if (showing === 'mine') mine.frame(clock); },
  draw: () => library.frame(clock),
};
</script></body></html>
