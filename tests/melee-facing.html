<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Melee facing gallery</title>
<style>body{margin:0;background:#242a26;color:#ece3c9;font:14px monospace}canvas{display:block;image-rendering:pixelated}p{margin:12px}</style>
<p>Walking south · west · north · east (weapons and bodies turn; cloth trails in world space)</p><canvas></canvas>
<script type="module">
import { DefendSim } from '../src/defend/sim.ts';
import { defaults } from '../src/save.ts';
import { defaultLayout, fitLayout } from '../src/defend/layout.ts';
import { generateCity } from '../src/defend/citygen.ts';
import { drawUnits } from '../src/defend/battle-art.ts';
import { meleeFacing } from '../src/defend/melee-facing.ts';
import { meleeBody } from '../src/defend/melee-body.ts';
import { BODY_FRAMES } from '../src/defend/melee-body-data.ts';
import { UnitOutline } from '../src/defend/unit-outline.ts';
import { pixelSprite, setPixelArt } from '../src/defend/pixel-sprites.ts';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const width=Math.min(960,innerWidth),px=width<500?42:64,col=width/4,row=width<500?124:146;
const kinds=['hero','valkyrie','sword','brawler','assassin','spearman','hoplite','lancer','warrior','amalgam','knight','champion'];
const dirs=[['south',0,1],['west',-1,0],['north',0,-1],['east',1,0]];
canvas.width=width;canvas.height=row*kinds.length;
const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),5),defaults().defend.levels,7);
sim.enemies=[];sim.civilians=[];sim.soldiers=[];
const outline=new UnitOutline();
function make(kind,x,y){
 const u={id:sim.newId(),kind,home:-1,x,y,hp:100,maxHp:100,damage:5,cd:1,target:-1,path:[],thinkT:0,flash:0};
 if(['warrior','amalgam'].includes(kind)){u.kind='undead';u.risen={look:kind,size:kind==='amalgam'?.65:.4,range:0};}
 if(['knight','champion'].includes(kind)){u.kind='reinforcement';u.called={look:kind,size:kind==='champion'?.65:.42,range:0,life:30,post:{x,y},squad:1};}
 return u;
}
function paint(u,{simple=false,reduced=true,merged=false}={}){
 sim.soldiers=[u];ctx.imageSmoothingEnabled=false;
 drawUnits({c:ctx,px},sim,null,false,undefined,{troops:simple,reduceMotion:reduced},merged?outline:undefined);
}
function draw({pixel=true,simple=false,merged=false}={}){
 setPixelArt(pixel);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#242a26';ctx.fillRect(0,0,canvas.width,canvas.height);
 kinds.forEach((kind,r)=>dirs.forEach(([dir,dx,dy],i)=>{
  const x=col*(i+.5)/px,y=(row*r+48)/px,u=make(kind,x-dx*.1,y-dy*.1);
  u.id=100+r*4+i;sim.time=0;meleeFacing(sim,u);u.x=x;u.y=y;sim.time=.1;paint(u,{simple,merged});
  ctx.fillStyle='#ece3c9';ctx.font=width<500?'10px monospace':'13px monospace';ctx.fillText(`${kind} ${dir}`,i*col+5,(r+1)*row-8);
 }));
}

window.facingFixture={draw,make,paint,sim,canvas,ctx,px,kinds,dirs,meleeFacing,meleeBody,setPixelArt,pixelSprite,BODY_FRAMES};draw();
</script></html>
