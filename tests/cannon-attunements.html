<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cannon attunements</title>
<style>body{margin:0;background:#242a26;color:#e6d8b4;font:14px monospace}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
import {defaults} from '../src/save.ts';
import {DefendSim} from '../src/defend/sim.ts';
import {CellType,generateCity} from '../src/defend/citygen.ts';
import {defaultLayout,fitLayout} from '../src/defend/layout.ts';
import {Towers,stepShells} from '../src/defend/towers.ts';
import {drawUnits} from '../src/defend/battle-art.ts';
import {drawBlazes} from '../src/defend/mage-art.ts';
import {drawMines} from '../src/defend/mine-art.ts';
import {drawInspect} from '../src/defend/inspect.ts';
import {stepMines} from '../src/defend/mines.ts';
import {paintStructureArt} from '../src/defend/structure-art.ts';
import {setPixelArt} from '../src/defend/pixel-sprites.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),small=innerWidth<700;
canvas.width=small?390:1050;canvas.height=small?960:330;
const kinds=['batteryTower','mortarTower','minelayerTower'],names=['Gun Battery: grapeshot at attuning','Mortar: impact and burning ground','Minelayer: walking Smart charges'];
function draw({pixel=true,reduced=false}={}){
 setPixelArt(pixel);c.fillStyle='#242a26';c.fillRect(0,0,canvas.width,canvas.height);c.imageSmoothingEnabled=false;
 kinds.forEach((kind,i)=>{
  c.save();c.translate(small?20:i*350+12,small?i*320:0);
  c.fillStyle='#e6d8b4';c.font='13px monospace';c.fillText(names[i],4,24);
  c.fillStyle='#384033';c.fillRect(0,40,320,270);
  c.strokeStyle='#414937';for(let x=0;x<=320;x+=32){c.beginPath();c.moveTo(x,40);c.lineTo(x,310);c.stroke();}for(let y=40;y<=310;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(320,y);c.stroke();}
  c.beginPath();c.rect(0,40,320,270);c.clip();
  c.translate(0,20);
  const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),4),defaults().defend.levels,1);
  sim.enemies=[];sim.soldiers=[];sim.civilians=[];sim.solid.fill(0);sim.map.type.fill(CellType.STREET);
  const b={...sim.keep,kind,structureUid:42,rect:{x:2,y:4,w:2,h:2}};sim.map.buildings[b.id]=b;
  const path=i===0?'gunnery':i===1?'siegeShot':'minelaying';
  if(i===2)sim.bonuses={...sim.bonuses,structurePaths:{42:{minelayerTower:{path,rank:3}}}};
  const e={id:sim.newId(),kind:'orc',x:7.5,y:5,hp:10000,maxHp:10000,cd:0,flash:0,jx:0,jy:0,distract:-1,distractT:0,rollT:0,marked:false};
  sim.enemies=[e];sim.reindexAfterDisplacement();new Towers().step(sim,0);stepShells(sim,2);
  if(i===2){sim.mines=[];for(let n=0;n<8;n++)sim.mines.push({x:5+n%3,y:3+Math.floor(n/3),age:1,damage:20,r:1.7,smart:true,origin:{x:3,y:5,building:b.id}});stepMines(sim,.2);}
  if(i===1)drawBlazes(c,32,sim);
  if(i===2){drawMines(c,32,sim,reduced);drawInspect(c,32,sim.map,sim,b.id,sim,0,reduced);}
  paintStructureArt(c,kind,{x:64,y:128,w:64,h:64,px:32},0,0,path);
  for(const fx of sim.effects)fx.t=.12;drawUnits({c,px:32},sim,null,false,undefined,{reduceMotion:reduced});
  c.restore();
 });
}
window.cannonGallery={draw,canvas,c};draw();
</script></html>
