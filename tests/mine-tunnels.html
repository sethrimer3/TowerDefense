<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mine tunnels and lighting fixture</title>
<style>body{margin:0;background:#080707}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}</style></head>
<body><canvas id="mine"></canvas><script type="module">
import { MineSim, P_DIG, P_RAIL, P_LAMP, noMetals } from '../src/mine/sim.ts';
import { MineRenderer } from '../src/mine/render.ts';
import { AIR, STONE, HARD_STONE, DENSE_STONE, TORCH, WORK_LAMP, LAMP, RAIL, idx, W } from '../src/mine/world.ts';
const sim = new MineSim(99), renderer = new MineRenderer(document.querySelector('canvas'));
sim.weatherOverride = 'clear';
sim.plan.fill(0); sim.miners.length = 0;
const base = sim.levels[0], start = 150, end = 235, rows = sim.tunnelRows[0];
for (let y = base - 18; y <= base + 18; y++) for (let x = start - 8; x < end + 8; x++) sim.world.set(x, y, STONE);
for (let x = start; x <= end; x++) {
  rows[x] = base + Math.round(2 * Math.sin((x - start) / 9));
  const top = rows[x] - 4 - Math.floor(2 + 2 * Math.sin(x / 6));
  for (let y = top; y <= rows[x]; y++) { sim.world.set(x, y, AIR); sim.plan[idx(x, y)] = P_DIG; }
  sim.world.set(x, rows[x], RAIL); sim.plan[idx(x, rows[x])] = P_RAIL;
}
for (const x of [157, 176, 191, 214, 230]) {
  const y = rows[x] - 2;
  sim.world.set(x, y, LAMP); sim.plan[idx(x, y)] = P_LAMP;
}
for (const x of [166, 222]) {
  const y = rows[x] - 1;
  sim.world.set(x, y, TORCH); sim.lightLife.set(idx(x, y), 1500);
}
for (const x of [182, 206]) sim.carts.push({ level: 0, side: x > 192 ? 1 : -1, x, y: rows[x], ...noMetals(), copper: 12, gold: x > 192 ? 3 : 0, state: 'parked', timer: 0 });
sim.addMiner(198, rows[198]);
const miner = sim.miners[0]; miner.action = 'dig'; miner.work = idx(199, rows[198] - 1);
sim.world.set(199, rows[198] - 1, HARD_STONE);
sim.world.set(197, rows[197] - 1, WORK_LAMP); sim.lightLife.set(idx(197, rows[197] - 1), 1800);
function draw(time = 1000, effects = true) { renderer.draw(sim, time, effects); }
renderer.resize();
renderer.zoomBy(2, renderer.canvas.width / 2, renderer.canvas.height / 2);
renderer.camX = 150; renderer.camY = base - renderer.canvas.height / renderer.scale / 2;
draw();
window.mineTunnels = { sim, renderer, draw, base, rows, materials: { TORCH, LAMP, WORK_LAMP, STONE, HARD_STONE, DENSE_STONE }, idx,
  natural() {
    const s = new MineSim(99); s.weatherOverride = 'clear'; s.setLevel('barracks', 2); for(let n=0;n<5;n++)s.hire();
    for(let n=0;n<80*60*30;n++)s.step();
    renderer.camX = 140; renderer.camY = s.levels[0] - renderer.canvas.height / renderer.scale / 2;
    renderer.draw(s, 5000, true); return { carts: s.carts.length, lamps: s.world.cells.filter(m=>m===LAMP).length, left: s.railReach(0,-1), right:s.railReach(0,1) };
  }
};
</script></body></html>
