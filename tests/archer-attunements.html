<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archer attunements</title>
<style>body{margin:0;background:#242a26;color:#eee4c9;font:14px monospace}canvas{display:block;image-rendering:pixelated}p{margin:12px}</style>
<p>Skirmishers · Javelin Bowmen · Skyranger — isolated battle/art fixture</p><canvas></canvas>
<script type="module">
import {defaults} from '../src/save.ts';
import {DefendSim} from '../src/defend/sim.ts';
import {generateCity} from '../src/defend/citygen.ts';
import {defaultLayout,fitLayout} from '../src/defend/layout.ts';
import {stepArcher} from '../src/defend/troops.ts';
import {stepArrows} from '../src/defend/towers.ts';
import {drawUnits} from '../src/defend/battle-art.ts';
import {paintStructureArt,paintStructureRubble,paintIcon} from '../src/defend/structure-art.ts';
import {ARCHER_ART,ARCHER_PNGS} from '../src/defend/archer-art-data.ts';
import {pixelSprite,setPixelArt} from '../src/defend/pixel-sprites.ts';
import {skyArrowView} from '../src/defend/archer-attunements.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');canvas.width=Math.min(1000,innerWidth);canvas.height=950;
const px=canvas.width<500?8:20;
function make(kind,rank=3){
 const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),4),defaults().defend.levels,1);
 sim.solid.fill(0);sim.ownSolid.fill(0);sim.foeSolid.fill(0);sim.enemies=[];sim.civilians=[];sim.effects=[];
 const home=sim.map.buildings.length;sim.map.buildings.push({...sim.keep,id:home,kind,structureUid:42});
 const path=kind==='rangerLodge'?'rangers':kind==='skirmishCamp'?'skirmishers':'skyranger';
 sim.bonuses={...sim.bonuses,structurePaths:{42:{[kind]:{path,rank}}}};
 const u={id:sim.newId(),kind:'archer',home,x:3,y:5,hp:100,maxHp:100,damage:10,cd:0,target:-1,path:[],thinkT:100,flash:0};sim.soldiers=[u];
 for(let i=0;i<6;i++)sim.enemies.push({id:sim.newId(),kind:'orc',x:5+i*3,y:5,hp:10000,maxHp:10000,cd:0,jx:0,jy:0,distract:-1,distractT:0,rollT:0,marked:false,flash:0});
 sim.reindexAfterDisplacement();return{sim,u};
}
const scenes=ARCHER_ART.map(a=>({...a,...make(a.kind)}));
function draw({pixel=true,time=.18,skyTime=.5,reduced=false,destruction=false}={}){
 setPixelArt(pixel);c.clearRect(0,0,canvas.width,canvas.height);c.fillStyle='#242a26';c.fillRect(0,0,canvas.width,canvas.height);c.imageSmoothingEnabled=false;
 scenes.forEach((s,i)=>{
  Object.assign(s,make(s.kind));stepArcher(s.sim,s.u,0);
  if(s.kind==='skyrangerLodge'){s.u.skyShots=4;s.u.cd=0;stepArcher(s.sim,s.u,0);}
  const elapsed=s.kind==='skyrangerLodge'?skyTime:s.kind==='skirmishCamp'?.04:time;
  for(let t=0;t<elapsed;t+=1/60){const dt=Math.min(1/60,elapsed-t);stepArrows(s.sim,dt);s.sim.time+=dt;}
  c.save();c.translate(0,i*300);c.fillStyle='#eee4c9';c.font='14px monospace';c.fillText(s.kind==='rangerLodge'?'Javelin Bowmen':s.kind==='skirmishCamp'?'Skirmishers: 7 arrows':'Skyranger: targeted rain',12,22);
  for(let stage=0;stage<4;stage++)paintStructureArt(c,s.kind,{x:12+stage*64,y:40,w:56,h:56,px:14},stage,0,s.path);
  paintStructureRubble(c,s.kind,{x:268,y:40,w:56,h:56,px:14},0,s.path);
  const icon=document.createElement('canvas');icon.width=icon.height=48;icon.dataset.look=s.path;paintIcon(icon,s.kind);c.drawImage(icon,332,44);
  c.translate(0,110);if(destruction&&s.kind==='rangerLodge')for(let t=elapsed;t<3;t+=1/30)stepArrows(s.sim,1/30);
  drawUnits({c,px},s.sim,null,false,undefined,{reduceMotion:reduced});c.restore();
 });
}
ARCHER_PNGS.forEach(pixelSprite);pixelSprite('archer');pixelSprite('enemy-orc');
window.archerFixture={draw,make,scenes,canvas,c,px,stepArcher,stepArrows,skyArrowView,ARCHER_PNGS,pixelSprite,setPixelArt,paintStructureArt};draw();
</script></html>
