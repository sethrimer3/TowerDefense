<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mage Guild attunements</title>
<style>body{margin:0;background:#252c2c;color:#ece2c2;font:14px monospace}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
import {defaults} from '../src/save.ts';
import {DefendSim} from '../src/defend/sim.ts';
import {CellType,generateCity} from '../src/defend/citygen.ts';
import {defaultLayout,fitLayout} from '../src/defend/layout.ts';
import {stepMage,stepFireballs} from '../src/defend/mages.ts';
import {drawUnits} from '../src/defend/battle-art.ts';
import {drawBlazes} from '../src/defend/mage-art.ts';
import {WizardArt} from '../src/defend/wizard-art.ts';
import {paintStructureArt} from '../src/defend/structure-art.ts';
import {setPixelArt} from '../src/defend/pixel-sprites.ts';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),small=innerWidth<700;
canvas.width=small?390:1140;canvas.height=small?1260:430;
const families=[['stormHall','conduction','Stormcallers'],['infernoHall','pyroclasm','Pyromancers'],['cinderHall','cinders','Cryomancers']];
function make(kind,rank=3){
 const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),4),defaults().defend.levels,1);
 sim.enemies=[];sim.soldiers=[];sim.civilians=[];sim.solid.fill(0);sim.ownSolid.fill(0);sim.foeSolid.fill(0);sim.map.type.fill(CellType.STREET);
 const home=sim.map.buildings.length;sim.map.buildings.push({...sim.keep,id:home,kind,structureUid:42});
 const path=families.find(f=>f[0]===kind)[1];sim.bonuses={...sim.bonuses,structurePaths:{42:{[kind]:{path,rank}}}};
 const u={id:sim.newId(),kind:'mage',home,x:1.5,y:2.5,hp:22,maxHp:22,damage:16,cd:0,target:-1,path:[],thinkT:100,flash:0};sim.soldiers=[u];
 for(let i=0;i<7;i++)sim.enemies.push({id:sim.newId(),kind:'orc',x:4+i*.9,y:2.5+(i%2)*.15,hp:10000,maxHp:10000,cd:0,flash:0,jx:0,jy:0,distract:-1,distractT:0,rollT:0,marked:false});
 sim.reindexAfterDisplacement();return {sim,u};
}
const scenes=[];
function draw({pixel=true,reduced=false,flight=false}={}){
 setPixelArt(pixel);c.fillStyle='#252c2c';c.fillRect(0,0,canvas.width,canvas.height);c.imageSmoothingEnabled=false;scenes.length=0;
 families.forEach(([kind,path,name],i)=>{
  const s=make(kind);scenes.push(s);s.sim.rand=()=>0;stepMage(s.sim,s.u,0);
  if(!flight){stepFireballs(s.sim,2);for(const b of s.sim.blazes)b.t=.3;for(const b of s.sim.mageBolts)b.t=.04;s.sim.time=.25;}
  else stepFireballs(s.sim,.18);
  c.save();c.translate(small?12:i*380+12,small?i*420:0);c.fillStyle='#ece2c2';c.font='15px monospace';c.fillText(name,4,25);
  for(let rank=0;rank<4;rank++){paintStructureArt(c,kind,{x:rank*86,y:42,w:68,h:102,px:17},0,0,rank?path:'');c.fillStyle='#ece2c2';c.font='12px monospace';c.fillText(['Attuned','I','II','III'][rank],rank*86+8,162);}
  c.translate(0,185);c.fillStyle='#354035';c.fillRect(0,0,350,145);
  c.save();c.beginPath();c.rect(0,0,350,145);c.clip();
  drawBlazes(c,32,s.sim);drawUnits({c,px:32},s.sim,null,false,undefined,{reduceMotion:reduced});new WizardArt().drawChill(c,32,s.sim,reduced?0:250);c.restore();
  c.fillStyle='#ece2c2';c.font='12px monospace';c.fillText(kind==='stormHall'?'Long-range chains and bright criticals':kind==='infernoHall'?'Full-area flames and clinging burns':'Icy blasts, brief freezes and strong slows',2,172);c.restore();
 });
}
window.mageGallery={draw,make,scenes,canvas,c,stepMage,stepFireballs};draw();
</script></html>
