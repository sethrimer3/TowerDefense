<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Melee cape gallery</title>
<style>body{margin:0;background:#242a26;color:#ece3c9;font:14px monospace}canvas{display:block;image-rendering:pixelated}p{margin:12px}</style>
<p>Unattuned 60% · I 70% · II 80% · III 90% · Hero 100%</p><canvas id="gallery"></canvas>
<script type="module">
import { DefendSim } from '../src/defend/sim.ts';
import { defaults } from '../src/save.ts';
import { defaultLayout, fitLayout } from '../src/defend/layout.ts';
import { generateCity } from '../src/defend/citygen.ts';
import { drawUnits } from '../src/defend/battle-art.ts';
import { drawMeleeCape } from '../src/defend/melee-cape.ts';
import { UnitOutline } from '../src/defend/unit-outline.ts';
import { pixelSprite, setPixelArt } from '../src/defend/pixel-sprites.ts';
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const width=Math.min(1000,innerWidth), px=width<500?42:64, col=width/5, row=width<500?96:126;
const cases=[['sword','crusaders'],['sword','berserkers'],['sword','halberdiers'],['brawler',null],
 ['assassin','bloodletters'],['assassin','shadowcloak'],['assassin','venom'],['assassin','headhunters'],
 ['spearman','longSpears'],['spearman','setSpears'],['hoplite','testudo'],['hoplite','spearWall'],
 ['lancer','heavyLance'],['lancer','wingedLancers'],['valkyrie','cloudborne'],
 ['undead','soulWeighing'],['undead','amalgam'],['reinforcement','hammerfall'],['reinforcement','muster'],['reinforcement','oathsworn']];
canvas.width=width;canvas.height=row*cases.length;
const sim=new DefendSim(generateCity(fitLayout(defaultLayout()),5),defaults().defend.levels,7);
sim.enemies=[];sim.civilians=[];sim.soldiers=[];sim.bonuses={...sim.bonuses,structurePaths:{}};
const units=[];
for(let r=0;r<cases.length;r++)for(let rank=0;rank<5;rank++){
 const [kind,path]=cases[r],hero=rank===4;
 const x=(col*(rank+.5))/px,y=(r*row+37)/px;
 const home=sim.map.buildings.length, uid=1000+home;
 sim.map.buildings.push({...sim.map.buildings[0],structureUid:uid,kind:'barracks'});
 const topic=kind==='sword'?'barracks':kind==='assassin'?'assassinDen':kind==='spearman'?'spearHall':kind==='hoplite'?'phalanx':kind==='lancer'?'lancerStable':kind==='valkyrie'?'valkyriePalace':kind==='undead'?'necromancy':'reinforcements';
 if(rank&&path&&!hero)sim.bonuses.structurePaths[uid]={[topic]:{path,rank}};
 const u={id:sim.newId(),kind:hero?'hero':kind,home:hero?-1:home,x,y,hp:100,maxHp:100,damage:5,cd:1,target:-1,path:[],thinkT:0,flash:0};
 // Summoned troops read spell snapshots; the gallery draws each rank alone.
 if(!hero&&kind==='undead')u.risen={look:path==='amalgam'?'amalgam':'warrior',size:.4,range:0};
 if(!hero&&kind==='reinforcement')u.called={look:'knight',size:.42,range:0,life:30,post:{x,y},squad:1};
 units.push({u,x,y,rank,path,kind});
}
const outline=new UnitOutline();
function draw(time=0,{pixel=true,reduced=true,merged=false,simple=false,moving=false}={}){
 setPixelArt(pixel);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#242a26';ctx.fillRect(0,0,canvas.width,canvas.height);sim.time=time;
 for(const item of units){
  const {u,x,y,rank,path,kind}=item;u.x=x;u.y=y+(moving?Math.sin(time*2)*.25:0);sim.soldiers=[u];
  if(u.risen)sim.bonuses.necromancy=rank&&path?{path,rank}:undefined;
  if(u.called)sim.bonuses.reinforcements=rank&&path?{path,rank}:undefined;
  drawUnits({c:ctx,px},sim,null,false,undefined,{troops:simple,reduceMotion:reduced},merged?outline:undefined);
 }
 ctx.font=width<500?'9px monospace':'12px monospace';ctx.fillStyle='#ece3c9';
 cases.forEach(([kind,path],r)=>ctx.fillText(path??kind,8,(r+1)*row-7));
}
pixelSprite('swordsman');
window.capeFixture={draw,sim,units,canvas,ctx,px,drawMeleeCape};draw();
</script></html>
